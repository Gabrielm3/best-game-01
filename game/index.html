<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellwether</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c140f; }
  body { display: grid; place-items: center; }
  #game { width: min(100vw, calc(100vh * 16 / 9)); height: auto; background: #1c140f; cursor: crosshair; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Bellwether. Lead the flock into the fold before dusk. Move with WASD. Click or Space rings a bell."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
